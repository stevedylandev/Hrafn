### ejabberd configuration for the Hrafn federation peer (beta.test).
### Mirrors the Prosody feature set so interop differences are visible.

hosts:
  - beta.test

loglevel: info

certfiles:
  - /home/ejabberd/conf/certs/beta.test.pem

# No ca_file: with the test CA loaded, ejabberd verifies Prosody's s2s
# certificate and offers SASL EXTERNAL, then crashes handling it (26.07:
# `bad return value: :badarg` on <auth mechanism='EXTERNAL'/>). Without it,
# both servers fall back to dialback (mod_s2s_dialback below).

listen:
  -
    port: 5222
    module: ejabberd_c2s
    starttls: true
    starttls_required: true
    max_stanza_size: 262144
  -
    port: 5223
    module: ejabberd_c2s
    tls: true                 # XEP-0368 Direct TLS
    max_stanza_size: 262144
  -
    port: 5269
    module: ejabberd_s2s_in
  -
    port: 5347                # XEP-0114, the push app server's stand-in
    ip: "0.0.0.0"
    module: ejabberd_service
    hosts:
      push.beta.test:
        password: "pushsecret"
  -
    # XEP-0363 over HTTPS. Same port inside and outside the container, so
    # the put/get URLs handed to clients on the host work as they are.
    port: 5443
    module: ejabberd_http
    tls: true
    request_handlers:
      /upload: mod_http_upload

auth_method: internal
auth_password_format: scram
# Prosody 13 still offers SCRAM-SHA-1 only, so ejabberd is the server that
# exercises the SCRAM-SHA-256 required for v1 (PLAN.md §1.1). Changing this
# invalidates stored hashes: recreate the ejabberd volume and re-register.
auth_scram_hash: sha256

s2s_use_starttls: optional
define_macro:
  ALLOW_S2S: allow

shaper_rules:
  max_user_sessions: 10
  c2s_shaper:
    none: admin
    normal: all

acl:
  local:
    user_regexp: ""
  admin:
    user:
      - "admin@beta.test"

access_rules:
  local:
    allow: local
  c2s:
    deny: blocked
    allow: all
  announce:
    allow: admin
  configure:
    allow: admin
  muc_create:
    allow: local
  pubsub_createnode:
    allow: local

api_permissions:
  "console commands":
    from:
      - ejabberd_ctl
    who: all
    what: "*"

modules:
  mod_adhoc: {}
  mod_auth_fast: {}         # XEP-0484 FAST (SASL2 and Bind 2 are built in)
  mod_blocking: {}          # XEP-0191
  mod_caps: {}              # XEP-0115
  mod_carboncopy: {}        # XEP-0280
  mod_client_state: {}      # XEP-0352
  mod_configure: {}
  mod_disco: {}             # XEP-0030
  mod_http_upload:          # XEP-0363
    put_url: "https://upload.beta.test:5443/upload"
    max_size: 16777216
  mod_last: {}
  mod_mam:                  # XEP-0313
    default: always
    assume_mam_usage: true
  mod_muc:                  # XEP-0045
    host: "conference.@HOST@"
    access_create: muc_create
    access_persistent: muc_create
    default_room_options:
      mam: true
  mod_muc_admin: {}
  mod_offline:
    access_max_user_messages: max_user_offline_messages
  mod_ping:                 # XEP-0199
    send_pings: true
  mod_privacy: {}
  mod_private: {}
  mod_pubsub:               # XEP-0060 / 0163, carries avatars and bookmarks
    access_createnode: pubsub_createnode
    plugins:
      - flat
      - pep
    force_node_config:
      storage:bookmarks:
        access_model: whitelist
      urn:xmpp:bookmarks:1:
        access_model: whitelist
      urn:xmpp:avatar:metadata:
        access_model: presence
  mod_push: {}              # XEP-0357
  mod_push_keepalive: {}
  mod_roster:
    versioning: true        # RFC 6121 roster versioning
  mod_s2s_dialback: {}      # XEP-0220, see ca_file above
  mod_sic: {}
  mod_stream_mgmt:          # XEP-0198
    resend_on_timeout: if_offline
  mod_vcard: {}             # XEP-0054
  mod_vcard_xupdate: {}     # XEP-0153
  mod_version: {}           # XEP-0092
